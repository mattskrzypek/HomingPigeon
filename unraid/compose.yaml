services:
  homingpigeon:
    image: nginx:alpine
    container_name: homingpigeon
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    ports:
      - "192.168.2.123:3004:8080"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    mem_limit: 128m
    cpus: 1
    pids_limit: 64
